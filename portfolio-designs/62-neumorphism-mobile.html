<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phuc — Neumorphism Mobile</title>
    <style>
      :root {
        --bg: #e7edf5;
        --panel: #edf3fb;
        --soft: #dfeaf6;
        --shadow-dark: rgba(163, 177, 198, 0.8);
        --shadow-light: rgba(255, 255, 255, 0.9);
        --blue: #9cc7ff;
        --ink: #212d41;
        --muted: #5d6982;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      .phone {
        max-width: 420px;
        margin: 28px auto;
        background: var(--bg);
        border-radius: 30px;
        padding: 20px 16px 24px;
        box-shadow:
          24px 24px 40px var(--shadow-dark),
          -24px -24px 40px var(--shadow-light);
      }
      .shell {
        background: var(--panel);
        border-radius: 24px;
        padding: 16px;
        box-shadow:
          inset 7px 7px 12px rgba(255, 255, 255, 0.9),
          inset -7px -7px 12px rgba(163, 177, 198, 0.32);
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 6px rgba(156, 199, 255, 0.25);
      }
      .hero {
        background: linear-gradient(135deg, #edf3fb, #dde8f6);
        border-radius: 18px;
        padding: 18px;
        box-shadow:
          10px 10px 18px rgba(163, 177, 198, 0.28),
          -10px -10px 18px rgba(255, 255, 255, 0.7);
      }
      .eyebrow {
        color: var(--muted);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0;
        font-size: 2.3rem;
        line-height: 1;
        letter-spacing: -0.06em;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 18px;
      }
      .card {
        border-radius: 18px;
        background: var(--panel);
        padding: 14px 12px;
        box-shadow:
          8px 8px 14px rgba(163, 177, 198, 0.28),
          -8px -8px 14px rgba(255, 255, 255, 0.8);
      }
      .card strong {
        display: block;
        font-size: 1.4rem;
      }
      .card span {
        color: var(--muted);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .cta {
        display: inline-block;
        margin-top: 18px;
        text-decoration: none;
        color: var(--ink);
        background: linear-gradient(135deg, #edf3fb, #dfeaf6);
        border-radius: 999px;
        padding: 12px 18px;
        box-shadow:
          8px 8px 16px rgba(163, 177, 198, 0.24),
          -8px -8px 16px rgba(255, 255, 255, 0.7);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="shell">
        <div class="top">
          <div class="brand">PHUC</div>
          <div class="dot"></div>
        </div>

        <section class="hero">
          <div class="eyebrow">Backend systems</div>
          <h1>Calm and reliable.</h1>
          <p>
            Clean architecture, resilient delivery, and product-minded
            engineering that scales without noise.
          </p>
        </section>

        <div class="stats">
          <div class="card"><strong>99.98</strong><span>uptime</span></div>
          <div class="card"><strong>184ms</strong><span>latency</span></div>
          <div class="card"><strong>8.4M</strong><span>requests</span></div>
          <div class="card"><strong>24/7</strong><span>watch</span></div>
        </div>

        <a class="cta" href="#">View profile</a>
      </div>
    </div>
  </body>
</html>
