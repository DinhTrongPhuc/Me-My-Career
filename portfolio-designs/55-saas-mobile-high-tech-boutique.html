<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phuc — SaaS Mobile High-Tech Boutique</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --ink: #111827;
        --muted: #667085;
        --line: #dfebf5;
        --blue: #2563eb;
        --violet: #7c3aed;
        --cyan: #0ea5e9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(180deg, #edf4ff, #f8faff);
        font-family: Arial, sans-serif;
        color: var(--ink);
      }
      .phone {
        max-width: 420px;
        margin: 30px auto;
        background: #f5f7fb;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 32px;
        padding: 18px 16px 26px;
        box-shadow: 0 26px 50px rgba(37, 99, 235, 0.08);
      }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .brand {
        font-weight: 900;
        letter-spacing: 0.12em;
      }
      .pill {
        background: rgba(37, 99, 235, 0.08);
        color: var(--blue);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .hero {
        background: linear-gradient(
          135deg,
          rgba(37, 99, 235, 0.12),
          rgba(124, 58, 237, 0.08)
        );
        border: 1px solid rgba(37, 99, 235, 0.12);
        border-radius: 22px;
        padding: 18px;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 0.7rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 800;
      }
      h1 {
        font-size: 2.2rem;
        line-height: 1.05;
        letter-spacing: -0.06em;
        margin: 12px 0;
      }
      .hero p {
        color: var(--muted);
        line-height: 1.7;
        margin: 0;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 12px;
      }
      .card strong {
        display: block;
        font-size: 1.3rem;
        margin-bottom: 6px;
      }
      .card span {
        color: var(--muted);
        font-size: 0.72rem;
      }
      .list {
        margin-top: 18px;
        list-style: none;
        padding: 0;
      }
      .list li {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }
      .cta {
        display: block;
        margin-top: 18px;
        background: linear-gradient(90deg, var(--blue), var(--violet));
        color: white;
        text-decoration: none;
        border-radius: 14px;
        text-align: center;
        padding: 14px 20px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="status"><span>9:41</span><span>5G</span></div>
      <header class="header">
        <div class="brand">PHUC</div>
        <div class="pill">Systems</div>
      </header>

      <section class="hero">
        <div class="eyebrow">Platform engineering</div>
        <h1>Ship better software.</h1>
        <p>
          Design, build, and optimize the backend infrastructure behind every
          reliable product experience.
        </p>
      </section>

      <div class="cards">
        <div class="card"><strong>24/7</strong><span>team watch</span></div>
        <div class="card"><strong>99.98</strong><span>availability</span></div>
        <div class="card"><strong>184ms</strong><span>p95 latency</span></div>
        <div class="card"><strong>8.4M</strong><span>requests / day</span></div>
      </div>

      <ul class="list">
        <li><span>APIs</span><strong>Strong</strong></li>
        <li><span>Ops</span><strong>Clear</strong></li>
        <li><span>Delivery</span><strong>Fast</strong></li>
      </ul>

      <a class="cta" href="#">View capabilities</a>
    </div>
  </body>
</html>
