<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phuc — Terminal CLI Mobile</title>
    <style>
      :root {
        --bg: #09110f;
        --panel: #101b19;
        --green: #9efb9c;
        --text: #d9f7e3;
        --muted: #97b7a7;
        --line: rgba(158, 251, 156, 0.2);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top,
            rgba(158, 251, 156, 0.12),
            transparent 30%
          ),
          #09110f;
        color: var(--text);
        font-family: Consolas, monospace;
      }
      .phone {
        max-width: 420px;
        margin: 28px auto;
        background: rgba(10, 16, 15, 0.96);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 18px 14px 26px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.68rem;
        margin-bottom: 18px;
      }
      .prompt {
        color: var(--green);
        font-weight: 700;
      }
      .screen {
        background: rgba(16, 27, 25, 0.8);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px 14px;
      }
      .line {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 8px 0;
        color: var(--muted);
      }
      .line.green {
        color: var(--green);
      }
      .hero {
        margin-top: 18px;
        background: rgba(255, 255, 255, 0.015);
        border-left: 2px solid var(--green);
        padding: 8px 0 8px 12px;
      }
      .hero strong {
        display: block;
        font-size: 1.4rem;
        color: var(--green);
        margin-bottom: 6px;
      }
      .cta {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 14px;
        text-decoration: none;
        color: var(--bg);
        background: var(--green);
        border-radius: 10px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="topbar">
        <span class="prompt">phuc@system</span><span>online</span>
      </div>
      <div class="screen">
        <div class="line green">$ ps aux | grep backend</div>
        <div class="line">api-gateway 201 0.4 12.1 ...</div>
        <div class="line">worker-queue 432 0.8 9.5 ...</div>
        <div class="line">scheduler 117 0.2 4.9 ...</div>
        <div class="hero">
          <strong>status: stable</strong>
          <span>deployments are clean and observability is active.</span>
        </div>
      </div>
      <a href="#" class="cta">run healthcheck</a>
    </div>
  </body>
</html>
