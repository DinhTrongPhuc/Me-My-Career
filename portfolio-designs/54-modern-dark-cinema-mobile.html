<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phuc — Modern Dark Cinema Mobile</title>
    <style>
      :root {
        --bg: #090c12;
        --panel: rgba(18, 23, 31, 0.86);
        --text: #edf2ff;
        --muted: #9aa8ba;
        --gold: #f2c46d;
        --blue: #66b3ff;
        --line: rgba(255, 255, 255, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, #0a0c11, #111827),
          radial-gradient(
            circle at top,
            rgba(102, 179, 255, 0.18),
            transparent 35%
          );
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .phone {
        max-width: 420px;
        margin: 28px auto;
        background: linear-gradient(
          180deg,
          rgba(13, 17, 24, 0.96),
          rgba(11, 15, 22, 0.98)
        );
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 18px 16px 26px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      }
      .notch {
        width: 120px;
        height: 20px;
        background: #05070a;
        border-radius: 999px;
        margin: 4px auto 16px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .logo {
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .badge {
        border: 1px solid rgba(242, 196, 109, 0.5);
        color: var(--gold);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .hero {
        padding: 18px 0 10px;
      }
      .eyebrow {
        color: var(--gold);
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: 2.5rem;
        line-height: 1;
        letter-spacing: -0.06em;
      }
      .hero p {
        color: var(--muted);
        line-height: 1.7;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px;
        margin-top: 18px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .metric {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 8px;
      }
      .metric strong {
        display: block;
        font-size: 1.3rem;
        color: var(--blue);
      }
      .metric span {
        color: var(--muted);
        font-size: 0.7rem;
      }
      .list {
        list-style: none;
        padding: 0;
        margin: 16px 0 0;
      }
      .list li {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
      }
      .list li:last-child {
        border-bottom: none;
      }
      .cta {
        display: block;
        margin-top: 18px;
        padding: 14px 18px;
        text-align: center;
        text-decoration: none;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          rgba(102, 179, 255, 0.25),
          rgba(242, 196, 109, 0.2)
        );
        color: var(--text);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="notch"></div>
      <div class="header">
        <div class="logo">PHUC</div>
        <div class="badge">LIVE</div>
      </div>

      <section class="hero">
        <div class="eyebrow">Backend systems</div>
        <h1>Built to perform.</h1>
        <p>
          Resilient APIs, process automation, and clear operational flow for
          product teams that need uptime without noise.
        </p>
      </section>

      <div class="panel">
        <div class="metrics">
          <div class="metric"><strong>99.98</strong><span>uptime</span></div>
          <div class="metric"><strong>184ms</strong><span>p95</span></div>
          <div class="metric"><strong>24/7</strong><span>watch</span></div>
        </div>
        <ul class="list">
          <li>Platform reliability</li>
          <li>Delivery workflows</li>
          <li>Monitoring & observability</li>
        </ul>
      </div>

      <a class="cta" href="#">See capabilities</a>
    </div>
  </body>
</html>
